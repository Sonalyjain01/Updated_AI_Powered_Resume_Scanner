# Local stand-ins for the services the backend can use. Not for production.
#   docker compose -f docker-compose.dev.yml up -d
#
# Then in backend/.env:
#   CLAMAV_ENABLED="true"          (CLAMAV_HOST=localhost, CLAMAV_PORT=3310)
#   STORAGE_BACKEND="s3"
#   S3_BUCKET="resumes"  S3_ENDPOINT_URL="http://localhost:9000"
#   S3_ACCESS_KEY_ID="minioadmin"  S3_SECRET_ACCESS_KEY="minioadmin"
services:
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    # The first start downloads virus definitions and can take a few minutes.

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  minio-data:
